# Import Tax Management System Client Configuration
# This file contains application-level configuration properties

# ==================== Application Settings ====================
app.name=Import Tax Management System
app.version=1.0.0
app.title=Import Tax Client

# ==================== RMI Configuration ====================
# RMI Registry Connection Settings
rmi.host=localhost
rmi.port=5000
rmi.url=rmi://localhost:5000/

# RMI Service Names
rmi.service.user=userService
rmi.service.tax=TaxService
rmi.service.import=ImportService
rmi.service.invoice=InvoiceService
rmi.service.payment=PaymentService

# ==================== UI Configuration ====================
# Window Dimensions
ui.window.login.width=500
ui.window.login.height=600
ui.window.dashboard.width=1400
ui.window.dashboard.height=800

# Spacing and Padding
ui.spacing.large=20
ui.spacing.medium=15
ui.spacing.small=10

# Component Heights
ui.component.button.height=40
ui.component.textfield.height=35
ui.component.sidebar.width=250
ui.component.header.height=60

# Border Radius
ui.border.radius=8
ui.border.radius.large=15
ui.border.radius.small=5

# ==================== Theme Configuration ====================
# Theme: FlatDarkLaf, FlatLightLaf
ui.theme.name=FlatDarkLaf
ui.theme.color.primary=0x0078D7
ui.theme.color.accent=0xFF8C00
ui.theme.color.success=0x22B14C
ui.theme.color.error=0xDC3545
ui.theme.color.warning=0xFFC107

# ==================== Logging Configuration ====================
# Log Levels: DEBUG, INFO, WARN, ERROR
logging.level=INFO
logging.level.client=INFO
logging.level.rmi=DEBUG
logging.file.max.size=10MB
logging.file.max.history=7
logging.file.total.size.cap=100MB

# Log Output
logging.console.enabled=true
logging.file.enabled=true
logging.file.path=logs/

# ==================== Session Configuration ====================
# Session timeout in minutes (0 = no timeout)
session.timeout=30

# Auto-save user preferences
session.autosave=true

# Remember login credentials (local storage only)
session.remember.credentials=false

# ==================== Feature Flags ====================
# Enable/disable features
features.dashboard=true
features.users=true
features.imports=true
features.taxes=true
features.invoices=true
features.payments=true
features.reports=true
features.notifications=true

# ==================== Performance Settings ====================
# Number of threads for background tasks
performance.thread.pool.size=4

# Cache size for frequently accessed data (MB)
performance.cache.size=50

# UI animation duration (ms)
performance.animation.duration=300

# ==================== Security Settings ====================
# Password policy
security.password.min.length=8
security.password.require.uppercase=true
security.password.require.numbers=true
security.password.require.special=true

# Session security
security.session.https=false
security.session.token.expiry=3600

# ==================== Development Settings ====================
# Enable debug mode (adds verbose logging)
dev.debug.mode=false

# Show stack traces in UI
dev.show.stacktraces=false

# Enable test data
dev.test.data=false

# Mock RMI responses (for testing without server)
dev.mock.rmi=false

---
# Configuration Format Notes:
# - Lines starting with '#' are comments
# - Property format: key=value
# - No spaces around equals sign
# - Use dot notation for nested properties
# - Colors use hexadecimal format: 0xRRGGBB
# - Dimensions use pixel units
# - File sizes: 10MB, 100GB, etc.
# - Time units: ms, s, min, hours, days
